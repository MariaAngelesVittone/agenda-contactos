<header>
  <h1>My contacts</h1>
</header>
<main>
  @for (contacto of contacts(); track contacto.id) {
    <div class="contacto card">
      <a class="link" [routerLink]="['/contacts', contacto.id]">
        <app-avatar [contact]="contacto" />
        <span class="info">
          <span class="name">{{ contacto.name }} {{ contacto.lastname }}</span>
          <span class="phone">{{ contacto.phone }}</span>
        </span>
      </a>
      <div class="actions">
        <a
          class="button secondary"
          [routerLink]="['/contacts', contacto.id, 'edit']"
          aria-label="Edit {{ contacto.name }} {{ contacto.lastname }}"
          >Edit</a
        >
        <button
          type="button"
          class="danger"
          (click)="eliminateContact(contacto)"
          aria-label="Delete {{ contacto.name }} {{ contacto.lastname }}"
        >
          Delete
        </button>
      </div>
    </div>
  } @empty {
    <p class="empty">You don't have any contacts yet. Use the + button to add one.</p>
  }
  <a class="fab" routerLink="/contacts/create" aria-label="Add contact">+</a>
</main>
