<header>
   <h1>My contacts</h1>
  <button>logout</button>
</header>
<main>
<form (Submit)="onSubmit($event)">
    <h1>New Contact</h1>
    <div class="card">
        <label for="name">Name</label>
        <input type="text" [formField]="formCreateContact.name" placeholder="Name" />
    </div>
    <div class="card">
        <label for="lastname">Last Name</label>
        <input type="text" [formField]="formCreateContact.lastname" placeholder="Last Name" />
    </div>
    <div class="card">
        <label for="phone">Phone</label>
        <input type="text" [formField]="formCreateContact.phone" placeholder="Phone" />
    </div>
    <button>{{id() ? 'Edit contact' : 'Add contact'}}</button>
</form>
</main>
